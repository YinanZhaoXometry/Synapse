# Desktop Release (epic 38) — tag-driven releases, the industry posture:
# merges accumulate on main WITHOUT releasing; a release happens only when a
# `desktop-v<version>` tag is pushed (`just desktop-release` does the tagging
# after desktop/package.json's version is bumped). The tag's CI run builds
# mac + win and publishes the GitHub Release under that exact tag, marked
# latest.
#
# Other triggers stay build-only (no release): pull_request (narrow paths
# filter — the pre-merge verification path for both installers) and
# workflow_dispatch (now that the workflow is registered on the default
# branch, any branch can be dispatched for a verification build). The gates
# themselves live in ci.yml.
#
# No repository secrets: the api URL default is the real deployed service
# (synapse-api-0lf4 — extracted from the live web bundle 2026-11-15),
# overridable via the DESKTOP_API_URL repo variable; publishing uses the
# workflow's GITHUB_TOKEN (job-scoped contents: write).
name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/desktop-release-notes.md"
      - "justfile"
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  # The api the desktop bundle is baked against: repo variable wins so a
  # moved/renamed api never needs a code change. Must end in /graphql —
  # sse-client.ts derives the /api/stream endpoint from it.
  DESKTOP_API_URL: ${{ vars.DESKTOP_API_URL || 'https://synapse-api-0lf4.onrender.com/graphql' }}

jobs:
  guard:
    name: guard (build? release?)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      should_build: ${{ steps.decide.outputs.should_build }}
      should_release: ${{ steps.decide.outputs.should_release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            # The release path: a desktop-v<version> tag was pushed.
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            # pull_request / workflow_dispatch: verification builds only.
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.name }})
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos
            os: macos-latest
            builder_args: --mac
            artifact_name: desktop-macos
            artifact_glob: release/*.dmg
          - name: windows
            os: windows-latest
            builder_args: --win
            artifact_name: desktop-windows
            artifact_glob: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      # electron's postinstall downloads the runtime per install; the cache
      # keeps repeat builds off the network. electron-builder's own tooling
      # cache rides along (windows).
      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Build the SPA (baked VITE_API_URL)
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ env.DESKTOP_API_URL }}

      - name: Stage the SPA into the shell
        shell: bash
        run: |
          rm -rf desktop/dist
          cp -R frontend/dist desktop/dist

      - name: Install shell deps
        working-directory: desktop
        run: npm ci

      - name: electron-builder (${{ matrix.name }})
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder_args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: release (GitHub Release)
    needs: [guard, build]
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The tag IS the version contract: the tag's suffix must equal
      # desktop/package.json's version, or the installers would carry a
      # different version than the release they ship in.
      - name: Tag ↔ package.json version guard
        run: |
          TAG_VERSION="${{ needs.guard.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#desktop-v}"
          PKG_VERSION="$(jq -r .version desktop/package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag ${{ needs.guard.outputs.tag }} does not match desktop/package.json version ${PKG_VERSION} — bump the version, then re-tag" >&2
            exit 1
          fi

      - name: Compose release notes
        run: |
          SHA="${{ needs.guard.outputs.sha }}"
          TAG="${{ needs.guard.outputs.tag }}"
          VERSION="${TAG#desktop-v}"
          PREV="$(git tag --list 'desktop-v*' --sort=-creatordate | grep -v "^${TAG}$" | head -n1 || true)"
          {
            echo "Synapse Desktop ${VERSION}"
            echo
            echo "## Commits"
            echo
            if [ -n "$PREV" ]; then
              git log --oneline "${PREV}..${TAG}"
            else
              git log --oneline "$SHA" | head -n 20
              echo "_first desktop release — latest 20 commits only_"
            fi
            echo
            cat .github/workflows/desktop-release-notes.md
          } > release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.guard.outputs.tag }}" \
            artifacts/desktop-macos/*.dmg \
            artifacts/desktop-windows/*.exe \
            --title "Synapse Desktop ${{ needs.guard.outputs.tag }}" \
            --notes-file release-notes.md \
            --latest
